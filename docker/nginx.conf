# Serves the SvelteKit static build. Four rules matter here, and each one breaks a
# specific feature of the app if it is wrong.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root /usr/share/nginx/html;

    # The engine is a 1.8 MB wasm file and the app chunks are a few hundred KB
    # each. nginx has served .wasm as application/wasm from its own mime.types
    # since 1.21.4, so that one needs no help. .mjs is the exception and is fixed
    # in the /_app/immutable/ block below.
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      application/javascript application/json application/wasm
                    image/svg+xml text/css text/plain;

    # adapter-static leaves `trailingSlash` at its default of `never`, so every
    # route is a flat file at the root: editor.html, privacy.html, terms.html.
    #
    # `=404` rather than naming /404.html directly: as the last try_files argument
    # the file is served with status 200, and every route here is prerendered, so
    # an unknown path really is a 404. error_page then supplies the body.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;

    # Content-hashed by the build, so the name changes whenever the bytes do.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";

        # pdf.js ships its worker as .mjs and pdf.js loads it as a module. nginx has
        # no .mjs entry in mime.types (still absent in 1.31.4), so it falls back to
        # application/octet-stream, and module scripts are subject to strict MIME
        # checking where classic scripts are not — the browser refuses the worker and
        # the PDF preview renders an empty pane.
        #
        # `types { }` rather than `types { application/javascript mjs; }`: a types block
        # REPLACES the inherited map instead of extending it, so the second form would
        # serve every other asset as octet-stream. Empty map plus default_type, scoped
        # to a nested location that matches nothing else, is the safe idiom.
        # add_header is inherited because this level declares none of its own.
        #
        # application/javascript rather than text/javascript: it is what this nginx
        # already serves .js as, and it is the spelling gzip_types lists above, so the
        # 1.4 MB worker gets compressed like every other chunk. Browsers accept either
        # for a module script.
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
        }
    }

    # version.pollInterval (60s in svelte.config.js) is how an open tab notices a
    # new deploy and stops asking for chunks that no longer exist. Caching either
    # of these two defeats it.
    location = /_app/version.json {
        add_header Cache-Control "no-cache";
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # The bundled TeX Live subset: ~5,100 files the service worker prefetches in
    # the background after the first compile so the core package set works
    # offline. Not content-hashed, so a week rather than a year.
    location /texlive/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
