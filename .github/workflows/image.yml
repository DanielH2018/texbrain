# Builds the self-hosting container image and pushes it to GHCR.
#
# Deliberately runs `pnpm check` and `pnpm test` before the build, the same gates
# deploy.yml runs before it publishes to Pages: a tree that fails them must not
# become an image a cluster pulls.
#
# The image name is lowercase and hardcoded. `github.repository_owner` preserves
# the account's capitalisation, and the Docker CLI rejects an uppercase reference.

name: build and push container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what the homelab pins, as `repo:latest@sha256:...` — the tag
      # keeps Renovate's docker manager able to offer a digest bump, which a bare
      # repo@sha256 could not. The commit tag is the rollback handle.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danielh2018/texbrain:latest
            ghcr.io/danielh2018/texbrain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
